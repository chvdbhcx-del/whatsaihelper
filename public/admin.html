<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИИ-ассистент WhatsApp</title>
<style>
  :root {
    --bg:#f3f5f4; --panel:#ffffff; --panel2:#f8faf9; --line:#e2e7e5; --text:#17201d; --muted:#66736e;
    --accent:#0f8f6f; --accent-soft:#e3f4ee; --accent-text:#0b6b53;
    --warn:#c26a00; --warn-soft:#fdf0dd; --bad:#c43c3c; --bad-soft:#fbe6e6;
    --bubble-in:#ffffff; --bubble-bot:#dcf3e9; --bubble-op:#e1ebfb;
    --shadow:0 1px 2px rgba(16,24,20,.06), 0 2px 8px rgba(16,24,20,.04);
    --radius:12px;
  }
  /* Тема: «Как в системе» (по умолчанию), «Светлая» или «Тёмная» (data-theme на <html>) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1412; --panel:#171d1a; --panel2:#1c2320; --line:#2a332f; --text:#e5ebe8; --muted:#94a19b;
      --accent:#22b38b; --accent-soft:#163a2f; --accent-text:#5fd6b2;
      --warn:#f0a13a; --warn-soft:#3a2a14; --bad:#ef6b6b; --bad-soft:#3d1c1c;
      --bubble-in:#1f2724; --bubble-bot:#173a2f; --bubble-op:#1b2a44;
      --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
      --bg:#0f1412; --panel:#171d1a; --panel2:#1c2320; --line:#2a332f; --text:#e5ebe8; --muted:#94a19b;
      --accent:#22b38b; --accent-soft:#163a2f; --accent-text:#5fd6b2;
      --warn:#f0a13a; --warn-soft:#3a2a14; --bad:#ef6b6b; --bad-soft:#3d1c1c;
      --bubble-in:#1f2724; --bubble-bot:#173a2f; --bubble-op:#1b2a44;
      --shadow:none; color-scheme:dark;
  }
  :root[data-theme="light"] { color-scheme:light; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); display:flex; overflow:hidden; }
  button, input, select, textarea { font:inherit; color:inherit; }
  svg { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Навигация ---------- */
  #nav { width:220px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 10px; gap:2px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 16px; }
  .brand .logo { width:34px; height:34px; border-radius:10px; background:var(--accent); color:#fff; display:grid; place-items:center; }
  .brand b { display:block; font-size:14px; line-height:1.2; }
  .brand small { color:var(--muted); font-size:12px; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; border:0; background:none; cursor:pointer; text-align:left; color:var(--muted); width:100%; }
  .nav-item:hover { background:var(--panel2); color:var(--text); }
  .nav-item.active { background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
  .nav-item .badge { margin-left:auto; }
  .nav-spacer { flex:1; }
  .nav-status { padding:10px; border-radius:10px; background:var(--panel2); font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:6px; }
  .badge { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--warn); color:#fff; font-size:11px; font-weight:700; display:inline-grid; place-items:center; }
  .badge[hidden] { display:none; }
  .theme-switch { display:flex; gap:2px; background:var(--panel2); padding:3px; border-radius:9px; margin-bottom:8px; }
  .theme-switch button { flex:1; border:0; background:none; padding:5px 0; border-radius:7px; cursor:pointer; color:var(--muted); display:grid; place-items:center; }
  .theme-switch button svg { width:16px; height:16px; }
  .theme-switch button.active { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
  @media (max-width: 820px) { .theme-switch { display:none; } }

  /* ---------- Общие элементы ---------- */
  #view { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .page { flex:1; overflow-y:auto; padding:24px 28px 40px; }
  .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .page-head h1 { margin:0; font-size:22px; font-weight:650; }
  .page-head p { margin:4px 0 0; color:var(--muted); max-width:720px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
  .card h2 { margin:0 0 4px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; border-radius:9px; padding:8px 14px; background:var(--accent); color:#fff; cursor:pointer; font-weight:550; white-space:nowrap; }
  .btn:hover { filter:brightness(1.06); }
  .btn:disabled { opacity:.55; cursor:default; filter:none; }
  .btn.ghost { background:var(--panel); color:var(--text); border-color:var(--line); }
  .btn.ghost:hover { background:var(--panel2); }
  .btn.danger { background:var(--panel); color:var(--bad); border-color:var(--line); }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .btn svg { width:16px; height:16px; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12px; font-weight:600; color:var(--muted); }
  .input { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); outline:none; }
  .input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .hint { color:var(--muted); font-size:12.5px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; background:var(--panel2); color:var(--muted); white-space:nowrap; }
  .pill.ok { background:var(--accent-soft); color:var(--accent-text); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .pill.bad { background:var(--bad-soft); color:var(--bad); }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:currentColor; }
  .row { display:flex; align-items:center; gap:10px; }
  .between { justify-content:space-between; }
  .empty { margin:auto; text-align:center; color:var(--muted); padding:40px; }
  .empty svg { width:44px; height:44px; stroke-width:1.4; opacity:.6; margin-bottom:8px; }
  .progress { height:7px; border-radius:5px; background:var(--panel2); overflow:hidden; border:1px solid var(--line); }
  .progress > div { height:100%; background:var(--accent); transition:width .3s; }
  .progress.full > div { background:var(--warn); }

  /* ---------- Диалоги ---------- */
  #chatsView { flex:1; display:flex; min-height:0; }
  #chatList { width:340px; flex:none; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #chatList .top { padding:16px 14px 10px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid var(--line); }
  #chatList h1 { margin:0; font-size:18px; }
  .tabs { display:flex; gap:4px; background:var(--panel2); padding:3px; border-radius:9px; }
  .tabs button { flex:1; border:0; background:none; padding:6px 4px; border-radius:7px; cursor:pointer; color:var(--muted); font-size:12.5px; font-weight:600; }
  .tabs button.active { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
  #chatItems { flex:1; overflow-y:auto; }
  .chat { display:flex; gap:11px; padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--line); position:relative; }
  .chat:hover { background:var(--panel2); }
  .chat.active { background:var(--accent-soft); }
  .chat.attn::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:var(--warn); }
  .avatar { width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:#fff; font-size:15px; }
  .chat .body { min-width:0; flex:1; }
  .chat .line1 { display:flex; justify-content:space-between; gap:8px; }
  .chat .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat .when { color:var(--muted); font-size:11.5px; flex:none; }
  .chat .line2 { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-top:2px; }
  .chat .last { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .chat .tags { display:flex; gap:4px; flex:none; }
  .tag { font-size:10.5px; padding:1px 7px; border-radius:8px; font-weight:600; background:var(--panel2); color:var(--muted); border:1px solid var(--line); }
  .tag.human { background:var(--warn-soft); color:var(--warn); border-color:transparent; }

  #conv { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  #conv .head { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  #conv .head .who { flex:1; min-width:0; }
  #conv .head .who b { display:block; }
  #conv .head .who small { color:var(--muted); }
  .handoff { margin:12px 20px 0; padding:10px 14px; border-radius:10px; background:var(--warn-soft); color:var(--warn); font-size:13px; display:flex; gap:8px; align-items:center; }
  #msgs { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:6px; }
  .m { max-width:min(640px, 72%); padding:8px 12px 6px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; box-shadow:var(--shadow); }
  .m small { display:block; color:var(--muted); font-size:11px; margin-top:3px; text-align:right; }
  .m.customer { background:var(--bubble-in); align-self:flex-start; border-top-left-radius:4px; }
  .m.bot { background:var(--bubble-bot); align-self:flex-end; border-top-right-radius:4px; }
  .m.operator { background:var(--bubble-op); align-self:flex-end; border-top-right-radius:4px; }
  .m.system { align-self:center; background:var(--panel); color:var(--muted); font-size:12px; padding:4px 12px; border-radius:20px; box-shadow:none; border:1px solid var(--line); }
  .m.system small { display:none; }
  .day { align-self:center; color:var(--muted); font-size:11.5px; margin:8px 0 2px; }
  #composer { display:flex; gap:10px; padding:12px 20px; background:var(--panel); border-top:1px solid var(--line); align-items:flex-end; }
  #composer textarea { flex:1; resize:none; min-height:42px; max-height:160px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel2); outline:none; }
  #composer textarea:focus { border-color:var(--accent); }

  /* ---------- Номера ---------- */
  .acc-card { display:flex; flex-direction:column; gap:12px; }
  .qr { align-self:center; background:#fff; padding:10px; border-radius:12px; border:1px solid var(--line); width:230px; max-width:100%; }
  .qr-steps { margin:0; padding-left:18px; color:var(--muted); font-size:13px; }
  .stat-line { display:flex; justify-content:space-between; gap:12px; font-size:13px; }
  .add-card { border-style:dashed; display:flex; flex-direction:column; justify-content:center; gap:10px; }

  /* ---------- ИИ ---------- */
  .providers { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:10px; margin-bottom:16px; max-width:900px; }
  .prov { border:1.5px solid var(--line); border-radius:11px; padding:12px; cursor:pointer; background:var(--panel); text-align:left; display:flex; flex-direction:column; gap:3px; }
  .prov:hover { border-color:var(--muted); }
  .prov.active { border-color:var(--accent); background:var(--accent-soft); }
  .prov b { font-size:13.5px; }
  .prov span { font-size:12px; color:var(--muted); }
  .prov .free { color:var(--accent-text); font-weight:600; }

  /* ---------- База знаний ---------- */
  #kb { display:flex; gap:16px; min-height:0; flex:1; }
  #kbFiles { width:240px; flex:none; display:flex; flex-direction:column; gap:2px; align-self:flex-start; }
  .kb-file { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; cursor:pointer; border:0; background:none; text-align:left; width:100%; color:var(--text); }
  .kb-file:hover { background:var(--panel2); }
  .kb-file.active { background:var(--accent-soft); color:var(--accent-text); font-weight:600; }
  .kb-file svg { width:16px; height:16px; }
  #kbEditor { flex:1; display:flex; flex-direction:column; min-width:0; }
  #kbText { flex:1; min-height:380px; resize:none; font:13.5px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace; padding:14px; }

  /* ---------- Статистика ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { padding:14px 16px; }
  .kpi small { color:var(--muted); font-size:12px; }
  .kpi b { display:block; font-size:24px; font-weight:650; margin-top:2px; }

  .list-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .chat .pick { display:none; width:18px; height:18px; margin:11px 0 0; flex:none; accent-color:var(--accent); }
  #chatItems.selecting .chat .pick { display:block; }
  #bulkBar { display:none; padding:10px 14px; border-top:1px solid var(--line); gap:8px; align-items:center; background:var(--panel); }
  #bulkBar.show { display:flex; }
  .icon-btn { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:9px; width:36px; height:36px; display:grid; place-items:center; cursor:pointer; flex:none; }
  .icon-btn:hover { color:var(--bad); border-color:var(--bad); }
  .icon-btn svg { width:17px; height:17px; }

  /* ---------- Ответ ботом на выбранное сообщение ---------- */
  .m { position:relative; }
  .m .quote, #botTask .quote { border-left:3px solid var(--accent); background:color-mix(in srgb, var(--text) 6%, transparent); border-radius:6px; padding:5px 8px; margin:2px 0 6px; font-size:12.5px; color:var(--muted); white-space:pre-wrap; }
  .bot-reply-btn { position:absolute; left:calc(100% + 6px); top:50%; transform:translateY(-50%); display:none; align-items:center; gap:5px; white-space:nowrap; border:1px solid var(--line); background:var(--panel); color:var(--accent-text, var(--accent)); border-radius:999px; padding:4px 10px 4px 8px; font-size:12px; cursor:pointer; box-shadow:var(--shadow); font-family:inherit; }
  .bot-reply-btn svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .m.customer:hover .bot-reply-btn, .m.customer.picked .bot-reply-btn { display:inline-flex; }
  .m.customer.picked { outline:2px solid var(--accent); outline-offset:2px; }
  #botTask { margin:0 14px; padding:10px 12px; border:1px solid var(--accent); border-bottom:0; border-radius:12px 12px 0 0; background:var(--panel); display:flex; flex-direction:column; gap:6px; }
  #botTask[hidden] { display:none; }
  #botTask .bt-head { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--accent-text, var(--accent)); }
  #botTask .bt-head svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #botTask .bt-close { margin-left:auto; border:0; background:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; }
  #botTask .quote { margin:0; }
  #botTask .bt-row { display:flex; gap:8px; }
  #botTask .bt-row .input { flex:1; }
  #botTask .hint { font-size:11.5px; }

  /* ---------- Журнал ---------- */
  .log-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .log-tools select { width:auto; }
  #logBox { flex:1; min-height:380px; overflow:auto; padding:6px 0; font:12.5px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .log-row { display:flex; gap:10px; padding:3px 14px; border-bottom:1px solid var(--line); }
  .log-row:last-child { border-bottom:0; }
  .log-row .t { color:var(--muted); flex:none; }
  .log-row .c { flex:none; width:92px; color:var(--muted); }
  .log-row .msg { white-space:pre-wrap; word-break:break-word; min-width:0; }
  .log-row.warn { background:var(--warn-soft); } .log-row.warn .msg { color:var(--warn); }
  .log-row.error { background:var(--bad-soft); } .log-row.error .msg { color:var(--bad); }

  /* ---------- Окна и уведомления ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; place-items:center; z-index:20; }
  #modal.open { display:grid; }
  #modal .card { width:min(420px, 92vw); }
  #modal .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; opacity:0; transition:.2s; pointer-events:none; z-index:30; font-weight:550; }
  #toast.show { opacity:1; transform:translateX(-50%); }
  #banner { display:none; padding:10px 20px; background:var(--accent); color:#fff; align-items:center; gap:12px; }
  #banner.show { display:flex; }
  #banner .btn { background:#fff; color:var(--accent-text); }

  @media (max-width: 820px) {
    body { flex-direction:column; overflow:auto; }
    #nav { width:100%; flex-direction:row; overflow-x:auto; padding:8px; border-right:0; border-bottom:1px solid var(--line); }
    .brand, .nav-spacer, .nav-status { display:none; }
    .nav-item { width:auto; flex:none; }
    #chatList { width:100%; max-height:45vh; border-right:0; }
    #chatsView { flex-direction:column; }
    .page { padding:16px; }
    #kb { flex-direction:column; } #kbFiles { width:100%; }
  }

  /* ================= Утилитарный вид «как мессенджер» ================= */
  :root { --rail:#1d2a26; --rail-text:#a9bab3; --rail-active:#2f4a41; --wall:#ece7df; --wall-dot:rgba(0,0,0,.045); }
  :root[data-theme="dark"] { --rail:#0b0f0e; --rail-text:#7f8f88; --rail-active:#1c2a25; --wall:#0c1110; --wall-dot:rgba(255,255,255,.03); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --rail:#0b0f0e; --rail-text:#7f8f88; --rail-active:#1c2a25; --wall:#0c1110; --wall-dot:rgba(255,255,255,.03); } }

  #nav { width:64px; padding:10px 8px; gap:4px; background:var(--rail); border-right:0; align-items:center; }
  .brand { padding:2px 0 12px; }
  .brand-text, .nav-item .lbl, #navStatus .lbl { display:none; }
  .nav-item { width:48px; height:44px; padding:0; justify-content:center; border-radius:12px; color:var(--rail-text); position:relative; }
  .nav-item svg { width:22px; height:22px; }
  .nav-item:hover { background:var(--rail-active); color:#fff; }
  .nav-item.active { background:var(--rail-active); color:#fff; }
  .nav-item.active::before { content:""; position:absolute; left:-8px; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); }
  .nav-item .badge { position:absolute; top:3px; right:2px; min-width:18px; height:18px; font-size:10px; padding:0 5px; margin:0; border:2px solid var(--rail); }
  #navStatus { background:none; padding:6px 0 2px; gap:8px; align-items:center; }
  #navStatus .st { display:grid; place-items:center; width:28px; height:16px; }
  #navStatus .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); }
  #navStatus .ok .dot { background:#2ecc8f; } #navStatus .warn .dot { background:var(--warn); } #navStatus .bad .dot { background:var(--bad); }

  #chatList { width:360px; }
  #chatList .top { padding:12px 12px 8px; gap:8px; border-bottom:0; }
  #chatList h1 { font-size:20px; }
  .search { display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:0 10px; }
  .search svg { width:16px; height:16px; color:var(--muted); }
  .search input { border:0; background:none; outline:none; padding:8px 0; flex:1; min-width:0; }
  .search:focus-within { border-color:var(--accent); }
  .tabs { background:none; padding:0; gap:6px; }
  .tabs button { flex:none; padding:4px 12px; border-radius:16px; background:var(--panel2); border:1px solid var(--line); font-size:12.5px; }
  .tabs button.active { background:var(--accent-soft); color:var(--accent-text); border-color:transparent; box-shadow:none; }
  .chat { padding:9px 12px; border-bottom:0; gap:12px; }
  .chat .body { border-bottom:1px solid var(--line); padding-bottom:9px; margin-bottom:-9px; }
  .avatar { width:46px; height:46px; font-size:17px; }
  .chat .line1 { align-items:baseline; }
  .chat .name { font-size:14.5px; }
  .chat .line2 { margin-top:3px; }
  .chat .last { font-size:13.5px; }
  .chat .last .who-op { font-weight:600; color:var(--warn); }
  .chat.attn::before { display:none; }
  .chat.attn .when { color:var(--warn); font-weight:600; }

</style>
<script>

<main id="view">

</main>

<div id="modal"><div class="card"><h2 id="modalTitle"></h2><div id="modalText" class="hint" style="font-size:13.5px"></div><label id="modalCheckRow" style="display:none;margin-top:12px;gap:8px;align-items:center;cursor:pointer;font-size:13.5px"><input type="checkbox" id="modalCheck"><span id="modalCheckText"></span></label><div class="actions"><button class="btn ghost" id="modalNo">Отмена</button><button class="btn" id="modalYes">Да</button></div></div></div>
<div id="toast"></div>

<script>
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const roleName = { customer:"Клиент", bot:"Ассистент", operator:"Оператор", system:"" };

async function api(path, opts = {}) {
  const r = await fetch("/admin/api" + path, { headers: { "Content-Type":"application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Ошибка " + r.status);
  return r.json();
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
function ask(title, text, yes = "Да", danger = false, checkbox = "") {
  return new Promise((resolve) => {
    $("#modalTitle").textContent = title; $("#modalText").textContent = text;
    $("#modalCheckRow").style.display = checkbox ? "flex" : "none"; $("#modalCheck").checked = false; $("#modalCheckText").textContent = checkbox;
    ask.checked = false;
    $("#modalCheck").onchange = (e) => { ask.checked = e.target.checked; };
    $("#modalYes").textContent = yes; $("#modalYes").className = danger ? "btn danger" : "btn";
    $("#modal").classList.add("open");
    const done = (v) => { $("#modal").classList.remove("open"); resolve(v); };
    $("#modalYes").onclick = () => done(true); $("#modalNo").onclick = () => done(false);
  });
}
const pad = (n) => String(n).padStart(2, "0");
function shortTime(t) {
  if (!t) return "";
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"2-digit" });
}
const hm = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayLabel = (t) => {
  const d = new Date(t), n = new Date(), y = new Date(Date.now() - 864e5);
  if (d.toDateString() === n.toDateString()) return "Сегодня";
  if (d.toDateString() === y.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day:"numeric", month:"long" });
};
const COLORS = ["#0f8f6f","#2f7dd1","#9b51e0","#d9534f","#e08a00","#16a2b8","#6b8e23","#c2185b"];
function avatar(name, id) {
  let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) | 0;
  const letter = (String(name || "").trim().replace(/^\+/, "")[0] || "#").toUpperCase();
  return `<div class="avatar" style="background:${COLORS[Math.abs(h) % COLORS.length]}">${esc(letter)}</div>`;
}
// Номер клиента. Если WhatsApp скрыл его (id вида …@lid) и настоящий номер неизвестен, так и пишем
const phone = (waId) => {
  const c = typeof waId === "object" ? waId : state.chats.find((x) => x.wa_id === waId);
  if (c?.phone) return "+" + c.phone;
  const id = String(c?.wa_id ?? waId).split("|").pop();
  return id.endsWith("@lid") ? "номер скрыт WhatsApp" : "+" + id.split("@")[0];
};

// ---------- Состояние ----------
const state = { view: "chats", status: null, chats: [], current: null, filter: "all", search: "", app: null, kbFile: null };
let accNames = {};

// ---------- Навигация ----------
function go(view) {
  state.view = view;
  $$(".nav-item").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
  try { localStorage.setItem("view", view); } catch {}
  render();
}
$$(".nav-item").forEach((b) => b.onclick = () => go(b.dataset.view));

function render() {
  const c = $("#content");
  if (state.view === "chats") return renderChats(c);
  if (state.view === "numbers") return renderNumbers(c);
  if (state.view === "ai") return renderAI(c);
  if (state.view === "kb") return renderKB(c);
  if (state.view === "stats") return renderStats(c);
  if (state.view === "logs") return renderLogs(c);
  if (state.view === "about") return renderAbout(c);
}

// ---------- Статус (каждые 3 с) ----------
const waText = { stopped:"Остановлен", starting:"Запуск…", qr:"Ждёт QR-код", connected:"Подключён", reconnecting:"Переподключение…", logged_out:"Вышли из аккаунта", error:"Ошибка", api:"Официальный API", dry_run:"Тестовый режим" };
const waKind = (st) => ["connected","api","dry_run"].includes(st) ? "ok" : ["qr","starting","reconnecting"].includes(st) ? "warn" : "bad";
async function refreshStatus() {
  try { state.status = await api("/status"); } catch { return; }
  accNames = Object.fromEntries(state.status.accounts.map((a) => [a.id, a.name]));
  const accs = state.status.accounts;
  const on = accs.filter((a) => waKind(a.wa.status) === "ok").length;
  const ai = state.status.ai;
  const ready = state.status.aiMock || (ai.provider === "anthropic" ? ai.anthropicKeySet : (ai.openaiKeySet || /localhost|127\.0\.0\.1/.test(ai.openaiBaseUrl || "")));
  const waKindAll = on === accs.length ? "ok" : on ? "warn" : "bad";
  $("#navStatus").innerHTML = `
    <div class="st ${waKindAll}" title="WhatsApp: подключено ${on} из ${accs.length}"><span class="dot"></span><span class="lbl">WhatsApp ${on}/${accs.length}</span></div>
    <div class="st ${ready ? "ok" : "bad"}" title="ИИ: ${ready ? "готов" : "нет ключа"}"><span class="dot"></span><span class="lbl">ИИ ${ready ? "готов" : "нет ключа"}</span></div>`;
  if (state.view === "numbers" && !document.activeElement?.dataset?.limit && document.activeElement?.id !== "addname") renderNumbers($("#content"), true);
}

// ---------- Диалоги ----------
async function refreshChats() {
  try { state.chats = await api("/chats"); } catch { return; }
  const attn = state.chats.filter((c) => c.needs_attention).length;
  $("#attnBadge").hidden = !attn; $("#attnBadge").textContent = attn;
  if (state.view === "chats") { drawChatList(); if (state.current) openChat(state.current, true); }
}
function renderChats(c) {
  c.innerHTML = `
    <div id="chatsView">
      <aside id="chatList">
        <div class="top">
          <div class="list-head"><h1>Чаты</h1><button class="btn ghost sm" id="selectBtn" type="button">Выбрать</button></div>
          <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="Поиск" value="${esc(state.search)}"></div>
          <div class="tabs"><button data-f="all">Все</button><button data-f="attn">Ждут ответа</button><button data-f="human">У оператора</button></div>
        </div>
        <div id="chatItems"></div>
        <div id="bulkBar"><label class="row" style="gap:6px;cursor:pointer"><input type="checkbox" id="pickAll" style="accent-color:var(--accent)">Все</label><span class="hint" id="pickCount" style="flex:1"></span><button class="btn danger sm" id="bulkDelete" type="button">Удалить</button></div>
      </aside>
      <section id="conv"><div class="empty"><svg viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12Z"/></svg><div>Выберите диалог слева</div></div></section>
    </div>`;
  $("#search").oninput = (e) => { state.search = e.target.value; drawChatList(); };
  $$(".tabs button").forEach((b) => b.onclick = () => { state.filter = b.dataset.f; drawChatList(); });
  $("#selectBtn").onclick = () => { state.selecting = !state.selecting; state.picked = new Set(); drawChatList(); };
  $("#pickAll").onchange = (e) => { state.picked = new Set(e.target.checked ? visibleChats().map((c) => c.wa_id) : []); drawChatList(); };
  $("#bulkDelete").onclick = async () => {
    const ids = [...state.picked]; if (!ids.length) return;
    if (!await ask(`Удалить диалоги (${ids.length})?`, "Переписка будет удалена из программы без возможности восстановления. У клиентов в WhatsApp сообщения останутся. Если клиент напишет снова, диалог начнётся заново.", "Удалить", true)) return;
    const r = await api("/chats/delete", { method:"POST", body: JSON.stringify({ ids }) });
    if (ids.includes(state.current)) closeChat();
    state.selecting = false; state.picked = new Set();
    toast(`Удалено диалогов: ${r.deleted}`); refreshChats();
  };
  drawChatList();
  if (state.current) openChat(state.current);
}
function visibleChats() {
  const q = state.search.trim().toLowerCase();
  return state.chats.filter((c) =>
    (state.filter === "all" || (state.filter === "attn" ? c.needs_attention : c.mode === "human")) &&
    (!q || `${c.name} ${c.wa_id} ${c.last_text}`.toLowerCase().includes(q)));
}
function closeChat() {
  state.current = null;
  const conv = $("#conv");
  if (conv) { conv.dataset.id = ""; conv.innerHTML = '<div class="empty"><div>Выберите диалог слева</div></div>'; }
}
function drawChatList() {
  const box = $("#chatItems"); if (!box) return;
  $$(".tabs button").forEach((b) => b.classList.toggle("active", b.dataset.f === state.filter));
  const multi = Object.keys(accNames).length > 1;
  const list = visibleChats();
  state.picked = new Set([...(state.picked || [])].filter((id) => state.chats.some((c) => c.wa_id === id)));
  box.classList.toggle("selecting", !!state.selecting);
  $("#bulkBar").classList.toggle("show", !!state.selecting);
  $("#selectBtn").textContent = state.selecting ? "Отмена" : "Выбрать";
  if (state.selecting) {
    $("#pickCount").textContent = state.picked.size ? `Выбрано: ${state.picked.size}` : "Отметьте диалоги";
    $("#bulkDelete").disabled = !state.picked.size;
    $("#pickAll").checked = list.length > 0 && list.every((c) => state.picked.has(c.wa_id));
  }
  const scroll = box.scrollTop;
  box.innerHTML = list.map((c) => `
    <div class="chat ${c.needs_attention ? "attn" : ""} ${c.wa_id === state.current ? "active" : ""}" data-id="${esc(c.wa_id)}">
      <input type="checkbox" class="pick" ${state.picked?.has(c.wa_id) ? "checked" : ""} tabindex="-1">
      ${avatar(c.name || phone(c.wa_id), c.wa_id)}
      <div class="body">
        <div class="line1"><span class="name">${esc(c.name || phone(c.wa_id))}</span><span class="when">${shortTime(c.updated_at)}</span></div>
        <div class="line2"><span class="last">${c.mode === "human" ? '<b class="who-op">Оператор · </b>' : ""}${esc(c.last_text)}</span>
          <span class="tags">${multi && accNames[c.account_id] ? `<span class="tag">${esc(accNames[c.account_id])}</span>` : ""}${c.needs_attention ? '<span class="attn-dot" title="Ждёт ответа оператора">!</span>' : ""}</span></div>
      </div>
    </div>`).join("") || `<div class="empty">${state.chats.length ? "Ничего не найдено" : "Пока нет диалогов.<br>Они появятся, когда клиенты напишут на подключённый номер."}</div>`;
  box.scrollTop = scroll;
  $$(".chat[data-id]", box).forEach((el) => el.onclick = () => {
    if (!state.selecting) return openChat(el.dataset.id);
    const id = el.dataset.id;
    state.picked.has(id) ? state.picked.delete(id) : state.picked.add(id);
    drawChatList();
  });
}
async function openChat(id, refresh) {
  state.current = id;
  let data; try { data = await api("/chats/" + encodeURIComponent(id)); } catch { return; }
  const conv = $("#conv"); if (!conv || state.current !== id) return;
  const { chat, messages } = data;
  const sig = `${messages.length}|${chat.mode}|${chat.needs_attention}|${chat.handoff_reason || ""}`;
  if (refresh && conv.dataset.sig === sig && conv.dataset.id === id) return;
  const box = $("#msgs");
  const atBottom = !box || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const sameChat = conv.dataset.id === id;
  const draft = sameChat ? ($("#text")?.value ?? "") : "";
  const hadFocus = sameChat && document.activeElement?.id === "text";
  conv.dataset.sig = sig; conv.dataset.id = id;
  let lastDay = "";
  const byId = new Map(messages.map((m) => [m.id, m]));
  const msgsHtml = messages.map((m) => {
    const d = dayLabel(m.created_at); const sep = d !== lastDay ? `<div class="day">${d}</div>` : ""; lastDay = d;
    if (m.role === "system") return `${sep}<div class="m system">${esc(m.text)}</div>`;
    const label = m.role === "bot" ? `<span class="role bot">Бот${m.directed ? " · по указанию" : ""}</span>` : m.role === "operator" ? '<span class="role op">Оператор</span>' : "";
    const q = m.reply_to ? byId.get(m.reply_to) : null;
    const quote = m.reply_to ? `<div class="quote">${q ? esc(q.text.length > 140 ? q.text.slice(0, 140) + "…" : q.text) : "Сообщение удалено"}</div>` : "";
    const act = m.role === "customer" ? `<button class="bot-reply-btn" data-mid="${m.id}" title="Ответить ботом на это сообщение"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Ответить ботом</button>` : "";
    return `${sep}<div class="m ${m.role}" data-mid="${m.id}">${label}${quote}${esc(m.text)}<span class="time">${hm(m.created_at)}</span>${act}</div>`;
  }).join("");
  const multi = Object.keys(accNames).length > 1;
  conv.innerHTML = `
    <div class="head">
      ${avatar(chat.name || phone(chat.wa_id), chat.wa_id)}
      <div class="who"><b>${esc(chat.name || phone(chat.wa_id))}</b><small>${chat.mode === "bot" ? "бот на связи" : "оператор на связи"} · ${esc(phone(chat))}${multi && accNames[chat.account_id] ? " · " + esc(accNames[chat.account_id]) : ""}</small></div>
      ${chat.mode === "bot"
        ? '<span class="pill ok"><span class="dot"></span>Отвечает бот</span><button class="btn sm" id="take">Взять диалог</button>'
        : '<span class="pill warn"><span class="dot"></span>Отвечаете вы</span><button class="btn ghost sm" id="release">Вернуть боту</button>'}
      <button class="icon-btn" id="delChat" title="Удалить диалог"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
    </div>
    ${chat.needs_attention || chat.handoff_reason ? `<div class="handoff"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>${esc(chat.handoff_reason || "Нужно внимание оператора")}</div>` : ""}
    <div id="msgs">${msgsHtml || '<div class="empty">Сообщений пока нет</div>'}</div>
    <div id="botTask" hidden>
      <div class="bt-head"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></svg><b>Бот ответит на сообщение</b><button type="button" class="bt-close" id="btClose" title="Отмена">×</button></div>
      <div class="quote" id="btQuote"></div>
      <div class="bt-row"><input class="input" id="btHint" placeholder="Что сказать? Например: предложи доставку завтра до 18:00 (необязательно)" maxlength="1000"><button class="btn sm" id="btGo" type="button">Ответить ботом</button></div>
      <div class="hint">Ответ уйдёт клиенту цитатой на это сообщение. Подсказку клиент не увидит. Режим чата не меняется.</div>
    </div>
    <form id="composer"><textarea id="text" rows="1" placeholder="Сообщение клиенту"></textarea><button class="send" title="Отправить (Enter)"><svg viewBox="0 0 24 24"><path d="M4 12 20 4l-4 16-4-6-8-2Z"/><path d="m12 14 8-10"/></svg></button></form>
    <div class="compose-hint">${chat.mode === "bot" ? "Бот отвечает сам. Если напишете здесь, бот замолчит в этом чате на час." : "Вы ведёте диалог. Нажмите «Вернуть боту», чтобы бот продолжил."} Enter — отправить, Shift+Enter — новая строка.</div>`;
  const t = $("#text"); t.value = draft;
  const grow = () => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; };
  t.oninput = grow; grow();
  if (hadFocus) t.focus();

    $(`#msgs .m[data-mid="${mid}"]`)?.scrollIntoView({ block:"nearest" });
  };

  $$("#msgs .bot-reply-btn").forEach((b) => b.onclick = (e) => { e.stopPropagation(); openTask(Number(b.dataset.mid)); });

  $("#btGo").onclick = async () => {
    const task = state.botTask; if (!task) return;
    const go = $("#btGo"); go.disabled = true; go.textContent = "Бот пишет…";
    try {
      await api(`/chats/${encodeURIComponent(id)}/bot-reply`, { method:"POST", body: JSON.stringify({ messageId: task.mid, hint: $("#btHint").value }) });
      state.botTask = null; state.botHint = ""; toast("Бот ответил клиенту");
    } catch (err) { toast("Бот не ответил: " + err.message); go.disabled = false; go.textContent = "Ответить ботом"; return; }
    refreshChats();
  };
  if (state.botTask?.chat === id && byId.has(state.botTask.mid)) { const h = state.botHint ?? ""; openTask(state.botTask.mid); $("#btHint").value = h; if (!hadFocus) $("#btHint").focus(); }
  else state.botTask = null;
  $("#btHint").oninput = (e) => { state.botHint = e.target.value; };
  t.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } };
  $("#composer").onsubmit = async (e) => {
    e.preventDefault();
    const text = t.value.trim(); if (!text) return;
    try { await api(`/chats/${encodeURIComponent(id)}/send`, { method:"POST", body: JSON.stringify({ text }) }); t.value = ""; }
    catch (err) { toast("Не отправлено: " + err.message); }
    refreshChats();
  };
  drawChatList();
}

function guessPreset(ai) {
  if (ai.provider === "anthropic") return "anthropic";
  return Object.keys(PRESETS).find((k) => PRESETS[k].url && PRESETS[k].url === ai.openaiBaseUrl) || "custom";
}
function renderAI(c) {
  const s = state.status; if (!s) { c.innerHTML = '<div class="page"><div class="empty">Загрузка…</div></div>'; return; }
  const cur = guessPreset(s.ai);
  let sel = cur;
  c.innerHTML = `
    <div class="page">
      <div class="page-head"><div><h1>Настройки ИИ</h1><p>Выберите, какой ИИ будет отвечать клиентам. Ключ хранится только на этом компьютере.</p></div></div>
      ${s.aiMock ? '<div class="handoff" style="margin:0 0 16px;max-width:900px">Включён тестовый режим ИИ (AI_MOCK=true): настоящие запросы не отправляются.</div>' : ""}
      <div class="providers">${Object.entries(PRESETS).map(([k, p]) => `<button class="prov" data-p="${k}"><b>${p.title}</b><span>${p.sub}</span>${p.free ? '<span class="free">Бесплатно</span>' : ""}</button>`).join("")}</div>
      <form class="card" id="aiForm" style="max-width:640px">
        <div id="oaFields">
          <div class="field"><label for="baseurl">Адрес API</label><input class="input" id="baseurl" placeholder="https://…/v1"></div>
        </div>
        <div class="field"><label for="aikey">Ключ API</label><input class="input" id="aikey" type="password" autocomplete="off"></div>
        <div id="modelFields">
          <div class="field"><label for="modelList">Модель</label>
            <div class="row"><select class="input" id="modelList"></select><button class="btn ghost sm" type="button" id="modelsReload" title="Запросить список моделей у сервиса">Обновить</button></div>
            <input class="input" id="model" placeholder="Название модели" style="margin-top:6px">
            <div class="hint" id="modelsState"></div>
          </div>
        </div>
        <div class="hint" id="presetHint" style="margin-bottom:14px"></div>
        <div class="row between"><span class="hint" id="aiState"></span><span class="row"><button class="btn ghost" type="button" id="aiTest">Проверить</button><button class="btn">Сохранить</button></span></div>
        <div id="aiTestResult" style="margin-top:12px"></div>
      </form>
    </div>`;
  const keySetFor = (k) => k === "anthropic" ? s.ai.anthropicKeySet : s.ai.openaiKeySet;
  const show = (k, fill) => {

    $("#oaFields").style.display = k === "anthropic" ? "none" : "block";
    $("#modelFields").style.display = k === "anthropic" ? "none" : "block";
    $("#aikey").placeholder = k === "ollama" ? "Не нужен" : keySetFor(k) && cur === k ? "Ключ сохранён. Введите новый, чтобы заменить" : k === "anthropic" ? "sk-ant-…" : "Вставьте ключ";
    $("#presetHint").textContent = p.hint;
    if (fill) { $("#baseurl").value = p.url; $("#model").value = p.model; }
    resetModels();
    if (k !== "anthropic" && (k === "ollama" || (keySetFor(k) && cur === k))) loadModels(!fill);
  };

  // ---- Список моделей по ключу ----
  let modelsReq = 0;
  function resetModels() {
    $("#modelList").innerHTML = '<option value="">Введите ключ, чтобы увидеть доступные модели</option>';
    $("#modelList").disabled = true; $("#modelsState").textContent = "";
    $("#model").style.display = "block";
  }
  async function loadModels(keepCurrent) {
    const baseUrl = $("#baseurl").value.trim(); if (!baseUrl) return;
    const req = ++modelsReq;
    $("#modelsState").textContent = "Запрашиваем список моделей…";
    let r; try { r = await api("/ai/models", { method:"POST", body: JSON.stringify({ baseUrl, apiKey: $("#aikey").value.trim() }) }); }
    catch (err) { r = { ok:false, error: err.message }; }

      resetModels();
      $("#modelsState").innerHTML = r.ok ? "Сервис не вернул ни одной модели. Впишите название вручную."
        : `<span style="color:var(--bad)">Список не получен.</span> ${esc(r.hint || "")} <span style="word-break:break-word">${esc(r.error || "")}</span>`;
      return;

    const current = $("#model").value.trim();
    const pick = keepCurrent && r.models.some((m) => m.id === current) ? current : r.recommended;
    const list = [...r.models.filter((m) => m.recommended), ...r.models.filter((m) => !m.recommended)];
    $("#modelList").innerHTML = list.map((m) => `<option value="${esc(m.id)}">${esc(m.id)}${m.recommended ? "  (рекомендуем)" : ""}${m.free && !r.onlyFree ? "  (бесплатно)" : ""}</option>`).join("")

    $("#modelList").disabled = false;
    $("#modelList").value = pick; $("#model").value = pick; $("#model").style.display = "none";

    $("#modelsState").innerHTML = `Доступно моделей: ${r.models.length}${r.onlyFree ? " (показаны только бесплатные)" : ""}.`

  };
  $("#modelsReload").onclick = () => loadModels(true);
  let keyTimer;
  $("#aikey").addEventListener("input", () => { clearTimeout(keyTimer); if (sel !== "anthropic" && $("#aikey").value.trim().length > 10) keyTimer = setTimeout(() => loadModels(true), 600); });
  $("#baseurl").addEventListener("change", () => loadModels(true));

  $("#baseurl").value = s.ai.openaiBaseUrl || ""; $("#model").value = s.ai.openaiModel || "";
  show(sel, false);
  $("#aiState").textContent = `Сейчас: ${PRESETS[cur].title}${cur !== "anthropic" && s.ai.openaiModel ? ", " + s.ai.openaiModel : ""}${keySetFor(cur) ? ", ключ сохранён" : cur === "ollama" ? "" : ", ключ не задан"}`;
  $$(".prov", c).forEach((b) => b.onclick = () => show(b.dataset.p, true));
  $("#aiTest").onclick = async () => {
    const out = $("#aiTestResult"), btn = $("#aiTest");
    btn.disabled = true; out.innerHTML = '<span class="pill warn"><span class="dot"></span>Сохраняем и проверяем…</span>';
    try {
      const body = { aiProvider: sel === "anthropic" ? "anthropic" : "openai" };
      const key = $("#aikey").value.trim();
      if (sel === "anthropic") body.anthropicApiKey = key;
      else Object.assign(body, { openaiBaseUrl: $("#baseurl").value.trim(), openaiModel: $("#model").value.trim(), openaiApiKey: key });
      await api("/settings", { method:"POST", body: JSON.stringify(body) });
      $("#aikey").value = "";
      const r = await api("/ai/test", { method:"POST" });
      out.innerHTML = r.ok
        ? `<div class="pill ok"><span class="dot"></span>Работает, ответ за ${(r.ms / 1000).toFixed(1).replace(".", ",")} с</div><div class="hint" style="margin-top:6px">${esc(r.text)}</div>`
        : `<div class="pill bad"><span class="dot"></span>Не работает</div>${r.hint ? `<div style="margin-top:6px">${esc(r.hint)}</div>` : ""}<div class="hint" style="margin-top:4px;word-break:break-word">${esc(r.error)}</div>`;
      refreshStatus();
    } catch (err) { out.textContent = "Ошибка: " + err.message; }
    btn.disabled = false;
  };
  $("#aiForm").onsubmit = async (e) => {
    e.preventDefault();
    const body = { aiProvider: sel === "anthropic" ? "anthropic" : "openai" };
    const key = $("#aikey").value.trim();
    if (sel === "anthropic") body.anthropicApiKey = key;
    else Object.assign(body, { openaiBaseUrl: $("#baseurl").value.trim(), openaiModel: $("#model").value.trim(), openaiApiKey: key });
    await api("/settings", { method:"POST", body: JSON.stringify(body) });
    toast("Настройки ИИ сохранены"); await refreshStatus(); renderAI(c);
  };
}

  const s = state.status;
  const sent = s ? s.accounts.reduce((x, a) => x + a.usage.sent, 0) : 0;
  const humans = state.chats.filter((ch) => ch.mode === "human").length;
  const fmt = (n) => Number(n || 0).toLocaleString("ru-RU");
  const sec = (ms) => ms ? (ms / 1000).toFixed(1).replace(".", ",") + " с" : "—";
  c.innerHTML = `
    <div class="page">
      <div class="page-head"><div><h1>Статистика</h1><p>Ответы считаются с полуночи, запросы к ИИ с момента запуска программы.</p></div>
        <button class="btn ghost" id="reset">Сбросить счётчики ИИ</button></div>
      <div class="kpis">
        <div class="card kpi"><small>Ответов бота сегодня</small><b>${fmt(sent)}</b></div>
        <div class="card kpi"><small>Диалогов всего</small><b>${fmt(state.chats.length)}</b></div>
        <div class="card kpi"><small>У оператора</small><b>${fmt(humans)}</b></div>
        <div class="card kpi"><small>Запросов к ИИ</small><b>${fmt(b.calls)}</b></div>
        <div class="card kpi"><small>Среднее время ответа ИИ</small><b>${sec(b.avgMs)}</b></div>
        <div class="card kpi"><small>Ошибок ИИ</small><b style="color:${b.errors ? "var(--bad)" : "inherit"}">${fmt(b.errors)}</b></div>
      </div>
      <div class="card" style="max-width:640px">
        <h2>Подробно</h2>
        <div class="stat-line" style="margin-top:10px"><span>95% ответов ИИ быстрее, чем</span><b>${sec(b.p95Ms)}</b></div>
        <div class="stat-line" style="margin-top:6px"><span>Отказов из-за лимита ИИ-сервиса (429)</span><b>${fmt(b.rateLimited)}</b></div>
        <div class="stat-line" style="margin-top:6px"><span>Токенов на входе / на выходе</span><b>${fmt(b.inputTokens)} / ${fmt(b.outputTokens)}</b></div>
      </div>
    </div>`;
  $("#reset").onclick = async () => { await api("/metrics/reset", { method:"POST" }); toast("Счётчики сброшены"); renderStats(c); };
}

// ---------- О программе и обновления ----------
const updText = {
  dev: "Запущено не из установщика: обновления отключены",
  idle: "Проверка ещё не выполнялась",
  checking: "Проверяем наличие новой версии…",
  latest: "У вас последняя версия",
  downloading: "Скачиваем новую версию…",
  downloaded: "Новая версия скачана и готова к установке",
  error: "Не удалось проверить обновления",
};
async function refreshApp() {
  let a; try { a = await api("/app"); } catch { return; }
  const changed = JSON.stringify(a) !== JSON.stringify(state.app);
  state.app = a;
  const ready = a.desktop && a.status === "downloaded";
  $("#updBadge").hidden = !ready;
  $("#banner").classList.toggle("show", ready);
  if (ready) $("#bannerText").textContent = `Доступна новая версия ${a.version}. Обновление займёт около минуты.`;
  if (changed && state.view === "about") renderAbout($("#content"));
}
async function installUpdate() {
  if (!await ask("Установить обновление?", "Программа закроется, обновится и запустится снова. Пока она перезапускается, бот не отвечает клиентам (около минуты).", "Обновить")) return;
  await api("/app/install", { method:"POST" }); toast("Устанавливаем обновление…");
}
$("#bannerBtn").onclick = installUpdate;
function renderAbout(c) {
  const a = state.app || {};
  const st = a.status || "idle";
  const kind = st === "error" ? "bad" : ["latest","downloaded"].includes(st) ? "ok" : "warn";
  c.innerHTML = `
    <div class="page">
      <div class="page-head"><div><h1>О программе</h1><p>ИИ-ассистент для WhatsApp: отвечает клиентам, которые написали вам, и передаёт сложные вопросы оператору.</p></div></div>
      <div class="grid" style="max-width:900px">
        <div class="card">
          <h2>Версия ${esc(a.current || "—")}</h2>
          ${a.desktop ? `
            <div class="row" style="margin:12px 0"><span class="pill ${kind}"><span class="dot"></span>${updText[st] || esc(st)}</span></div>
            ${st === "downloading" ? `<div class="progress" style="margin-bottom:8px"><div style="width:${a.percent || 0}%"></div></div><div class="hint">Версия ${esc(a.version)}: ${a.percent || 0}%</div>` : ""}
            ${st === "error" ? `<div class="hint" style="color:var(--bad);margin-bottom:10px">${esc(a.error || "")}</div>` : ""}
            ${a.checkedAt ? `<div class="hint">Последняя проверка: ${new Date(a.checkedAt).toLocaleString("ru-RU")}</div>` : ""}
            <div class="row" style="margin-top:14px">
              ${st === "downloaded" ? '<button class="btn" id="install">Перезапустить и обновить</button>' : `<button class="btn ghost" id="check" ${["checking","downloading","dev"].includes(st) ? "disabled" : ""}>Проверить обновления</button>`}
            </div>
            <p class="hint" style="margin-top:14px">Программа сама проверяет обновления при запуске и каждые 4 часа и скачивает их в фоне. Установка происходит после вашего подтверждения или при следующем закрытии программы. Номера, ключи и переписка при обновлении сохраняются.</p>`
          : '<p class="hint" style="margin-top:8px">Запущено как сервер, без установщика. Чтобы обновить, скачайте новую версию из репозитория и перезапустите.</p>'}
        </div>
        ${a.desktop ? `<div class="card">
          <h2>Надёжность</h2>
          <label class="row" style="margin:12px 0;cursor:pointer"><input type="checkbox" id="autostart" ${a.autostart ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--accent)"><span>Запускать вместе с Windows (в свёрнутом виде)</span></label>
          <ul class="hint" style="padding-left:18px;margin:0;font-size:13px;line-height:1.6">
            <li>Пока программа открыта, компьютер не уходит в сон: связь с WhatsApp не рвётся.</li>
            <li>При потере связи программа переподключается сама, без остановки.</li>
            <li>Сессия каждого номера сохраняется в резервную копию. Если файл повредится, номер восстановится без нового QR-кода.</li>
            <li>Если номер отключился или требует QR-кода, Windows покажет уведомление, а запись появится в «Журнале».</li>
          </ul>
        </div>` : ""}
        <div class="card">
          <h2>Правила работы бота</h2>
          <ul class="hint" style="padding-left:18px;margin:10px 0 0;font-size:13px;line-height:1.6">
            <li>Отвечает только тем, кто написал первым. Рассылок нет.</li>
            <li>Не больше заданного лимита ответов в день на номер.</li>
            <li>Если клиент всерьёз спросит, человек ли с ним говорит, честно скажет, что он виртуальный ассистент.</li>
            <li>Сложные вопросы и просьбы позвать человека передаёт оператору.</li>
            <li>Режим QR неофициальный: WhatsApp может заблокировать номер.</li>
          </ul>
        </div>
      </div>
    </div>`;
  $("#check") && ($("#check").onclick = async () => { await api("/app/check", { method:"POST" }); toast("Проверяем…"); setTimeout(refreshApp, 800); });
  $("#install") && ($("#install").onclick = installUpdate);
  $("#autostart") && ($("#autostart").onchange = async (e) => {
    const r = await api("/app/autostart", { method:"POST", body: JSON.stringify({ on: e.target.checked }) });
    toast(r.on ? "Автозапуск включён" : "Автозапуск выключен"); refreshApp();
  });
}

// ---------- Журнал ----------
const CATS = { "": "Все события", whatsapp: "WhatsApp", message: "Сообщения", ai: "ИИ", limit: "Лимиты", update: "Обновления", app: "Программа", system: "Системные" };
const logState = { items: [], last: 0, level: "", category: "", seenErr: 0, follow: true };
async function refreshLogs() {
  let fresh; try { fresh = await api(`/logs?after=${logState.last}`); } catch { return; }
  if (!fresh.length) return;
  logState.last = fresh.at(-1).id;
  logState.items.push(...fresh);
  if (logState.items.length > 3000) logState.items.splice(0, logState.items.length - 3000);
  const newErr = logState.items.filter((e) => e.level === "error" && e.id > logState.seenErr).length;
  $("#errBadge").hidden = !newErr || state.view === "logs"; $("#errBadge").textContent = newErr;
  if (state.view === "logs") drawLogs();
}
function logTime(t) { const d = new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function filteredLogs() {
  const lv = logState.level === "error" ? ["error"] : logState.level === "warn" ? ["warn", "error"] : null;
  return logState.items.filter((e) => (!lv || lv.includes(e.level)) && (!logState.category || e.category === logState.category));
}
function drawLogs() {
  const box = $("#logBox"); if (!box) return;
  logState.seenErr = logState.last; $("#errBadge").hidden = true;
  const list = filteredLogs();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = list.map((e) => `<div class="log-row ${e.level}"><span class="t">${logTime(e.time)}</span><span class="c">${esc(CATS[e.category] || e.category)}</span><span class="msg">${esc(e.message)}</span></div>`).join("")
    || '<div class="empty">Записей пока нет</div>';
  if (atBottom || logState.follow) { box.scrollTop = box.scrollHeight; logState.follow = false; }
}
function renderLogs(c) {
  c.innerHTML = `
    <div class="page" style="display:flex;flex-direction:column">
      <div class="page-head"><div><h1>Журнал</h1><p>Что делает программа: подключение номеров, входящие и ответы, работа ИИ, ошибки и обновления. Тексты переписки сюда не пишутся, номера клиентов скрыты, поэтому журнал можно спокойно отправить, если нужна помощь.</p></div></div>
      <div class="log-tools">
        <select class="input" id="logLevel"><option value="">Все уровни</option><option value="warn">Предупреждения и ошибки</option><option value="error">Только ошибки</option></select>
        <select class="input" id="logCat">${Object.entries(CATS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
        <span style="flex:1"></span>
        <button class="btn ghost sm" id="logCopy">Скопировать</button>
        <a class="btn ghost sm" href="/admin/api/logs/download" download style="text-decoration:none">Скачать за 3 дня</a>
        ${state.app?.desktop ? '<button class="btn ghost sm" id="logFolder">Открыть папку</button>' : ""}
      </div>
      <div class="card" id="logBox" style="padding:0"></div>
      <div class="hint" style="margin-top:8px">Файлы журнала хранятся 14 дней в папке программы (data\\logs).</div>
    </div>`;
  $("#logLevel").value = logState.level; $("#logCat").value = logState.category;
  $("#logLevel").onchange = (e) => { logState.level = e.target.value; logState.follow = true; drawLogs(); };
  $("#logCat").onchange = (e) => { logState.category = e.target.value; logState.follow = true; drawLogs(); };
  $("#logCopy").onclick = async () => {
    const text = filteredLogs().map((e) => `${new Date(e.time).toISOString()} ${e.level.toUpperCase()} [${e.category}] ${e.message}`).join("\n");
    try { await navigator.clipboard.writeText(text); toast("Журнал скопирован"); } catch { toast("Не удалось скопировать"); }
  };
  $("#logFolder") && ($("#logFolder").onclick = () => api("/logs/open-folder", { method:"POST" }).then(() => toast("Папка журнала открыта")));
  logState.follow = true;
  drawLogs();
}

// ---------- Тема ----------
const THEMES = {
  system: { name: "Тема: как в системе", icon: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>' },
  light: { name: "Тема: светлая", icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>' },
  dark: { name: "Тема: тёмная", icon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>' },
};
let currentTheme = "system";
function applyTheme(t) {
  currentTheme = THEMES[t] ? t : "system";
  if (currentTheme === "light" || currentTheme === "dark") document.documentElement.dataset.theme = currentTheme;
  else document.documentElement.removeAttribute("data-theme");
  $("#themeIcon").innerHTML = THEMES[currentTheme].icon;
  $("#themeBtn").title = THEMES[currentTheme].name + " (нажмите, чтобы сменить)";
  $("#themeLbl").textContent = THEMES[currentTheme].name;
}
{
  let t = "system"; try { t = localStorage.getItem("theme") || "system"; } catch {}
  applyTheme(t);
  $("#themeBtn").onclick = () => {
    const next = { system: "light", light: "dark", dark: "system" }[currentTheme];
    try { localStorage.setItem("theme", next); } catch {}
    applyTheme(next);
    toast(THEMES[next].name);
    fetch("/admin/api/app/theme", { method:"POST", headers: { "Content-Type":"application/json" }, body: JSON.stringify({ theme: next }) }).catch(() => {});
  };
}

// ---------- Запуск ----------
(async () => {
  let v = "chats"; try { v = localStorage.getItem("view") || "chats"; } catch {}
  await Promise.all([refreshStatus(), refreshChats(), refreshApp()]);
  go(["chats","numbers","ai","kb","stats","logs","about"].includes(v) ? v : "chats");
  setInterval(refreshStatus, 3000);
  setInterval(refreshChats, 4000);
  setInterval(refreshApp, 5000);
  setInterval(refreshLogs, 3000);
  refreshLogs();
})();
</script>
</body>
</html>
