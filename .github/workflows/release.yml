# Собирает установщик для Windows и публикует его в GitHub Releases.
# Запуск: отправьте тег вида v1.2.0 (версия должна совпадать с package.json)
# или нажмите «Run workflow» во вкладке Actions.
# Установленные программы сами находят новую версию в Releases и обновляются.
name: Сборка установщика Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка установщика
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Публикация в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          FILES="dist/WhatsApp-AI-Assistant-Setup-$VERSION.exe dist/WhatsApp-AI-Assistant-Setup-$VERSION.exe.blockmap dist/latest.yml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "Версия $VERSION" --notes "Установщик для Windows. Установленные программы обновятся сами."
          fi
